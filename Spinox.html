<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تفعيل المود | SPINOX GUL</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f0f13; color: #fff; font-family: system-ui, sans-serif;
               min-height: 100vh; display: flex; align-items: center;
               justify-content: center; padding: 20px; }
        .card { background: #17181f; padding: 36px 28px; border-radius: 18px;
                box-shadow: 0 8px 32px rgba(0,0,0,0.6); border: 1px solid #232430;
                max-width: 420px; width: 100%; }
        h1 { color: #f39c12; font-size: 22px; margin-bottom: 10px; text-align: center; }
        .subtitle { color: #7a7a9a; font-size: 14px; text-align: center;
                    margin-bottom: 20px; line-height: 1.6; }

        .token-box { background: #1a1b24; border: 1px solid #2d2f3f; border-radius: 8px;
                     padding: 10px 14px; font-size: 13px; color: #5a5a7a;
                     margin-bottom: 8px; display: flex; justify-content: space-between;
                     align-items: center; }
        .token-box span { color: #f39c12; font-weight: bold; font-size: 16px;
                          letter-spacing: 2px; direction: ltr; }
        .token-warn { font-size: 12px; color: #e74c3c; text-align: center;
                      margin-bottom: 20px; }

        .options-container { margin-bottom: 20px; }
        .radio-option { background: #1f2029; padding: 14px 16px; border-radius: 10px;
                        margin-bottom: 10px; display: flex; align-items: center;
                        cursor: pointer; border: 2px solid #2d2f3f; transition: 0.2s; }
        .radio-option:hover { border-color: #f39c12; background: #23242e; }
        .radio-option input { margin-left: 14px; width: 18px; height: 18px;
                              accent-color: #f39c12; flex-shrink: 0; }
        .radio-label { font-size: 15px; font-weight: bold; }
        .radio-sub { font-size: 12px; color: #7a7a9a; margin-top: 3px; }

        .btn-activate { background: linear-gradient(135deg, #2ecc71, #27ae60);
                        color: #fff; border: none; padding: 15px; font-size: 16px;
                        font-weight: bold; border-radius: 10px; cursor: pointer;
                        width: 100%; transition: 0.2s; }
        .btn-activate:hover { opacity: 0.9; }
        .btn-activate:disabled { opacity: 0.4; cursor: not-allowed; }

        .spinner-wrap { display: none; flex-direction: column;
                        align-items: center; padding: 20px 0; }
        .spinner { border: 3px solid #1f2029; border-top: 3px solid #f39c12;
                   border-radius: 50%; width: 36px; height: 36px;
                   animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status-text { margin-top: 14px; font-size: 15px; font-weight: bold;
                       text-align: center; padding: 12px; border-radius: 8px;
                       display: none; }
        .status-success { background: #0d2e1a; color: #2ecc71; border: 1px solid #2ecc71; }
        .status-error   { background: #2e0d0d; color: #e74c3c; border: 1px solid #e74c3c; }
        .status-loading { background: #2e2a0d; color: #f1c40f; border: 1px solid #f1c40f; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #3a3a5a; }
    </style>
</head>
<body>
<div class="card">
    <h1>🚀 بوابة التفعيل الذكية</h1>
    <p class="subtitle">لقد تخطيت الرابط بنجاح!<br>اختر مدة التفعيل واضغط تفعيل.</p>

    <div class="token-box">
        رمز التفعيل: <span id="tokenDisplay">...</span>
    </div>
    <p class="token-warn">⚠ هذا الرمز صالح لمدة 15 دقيقة فقط ولمرة واحدة</p>

    <div class="options-container" id="optionsGroup">
        <label class="radio-option">
            <input type="radio" name="duration" value="2" checked>
            <div>
                <div class="radio-label">⚡ تفعيل 48 ساعة</div>
                <div class="radio-sub">يومان كاملان مجاناً</div>
            </div>
        </label>
        <label class="radio-option">
            <input type="radio" name="duration" value="7">
            <div>
                <div class="radio-label">🌟 تفعيل 7 أيام</div>
                <div class="radio-sub">أسبوع كامل مجاناً</div>
            </div>
        </label>
    </div>

    <button id="authBtn" class="btn-activate" onclick="processActivation()">
        ✅ تفعيل الأداة الآن
    </button>

    <div class="spinner-wrap" id="spinnerWrap">
        <div class="spinner"></div>
    </div>

    <div id="statusMsg" class="status-text"></div>
    <div class="footer">SPINOX GUL © 2026</div>
</div>

<script>
    const SUPABASE_URL = "https://loxrjtxljiqnhvmphzyr.supabase.co";
    const ANON_KEY     = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxveHJqdHhsamlxbmh2bXBoenlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNDI3MzQsImV4cCI6MjA5NDcxODczNH0.CT0Nk9OHL6u9Hwo69L9Wi2ulKHZfdxusOOI6hWkj7Ms";

    const urlParams = new URLSearchParams(window.location.search);
    const token     = urlParams.get('token');

    // عرض الـ token
    document.getElementById('tokenDisplay').innerText = token || 'غير موجود!';

    // إذا لا يوجد token أظهر خطأ فوراً
    if (!token) {
        showStatus("❌ رمز التفعيل مفقود! احصل على رابط جديد من الأداة.", "error");
        document.getElementById('authBtn').disabled = true;
        document.getElementById('optionsGroup').style.display = 'none';
    }

    function showStatus(text, type) {
        const el = document.getElementById('statusMsg');
        el.innerText     = text;
        el.className     = 'status-text status-' + type;
        el.style.display = 'block';
    }

    function processActivation() {
        if (!token) {
            showStatus("❌ رمز التفعيل مفقود!", "error");
            return;
        }

        const days = parseInt(
            document.querySelector('input[name="duration"]:checked').value);

        document.getElementById('authBtn').disabled          = true;
        document.getElementById('authBtn').style.display     = 'none';
        document.getElementById('optionsGroup').style.display = 'none';
        document.getElementById('spinnerWrap').style.display  = 'flex';
        showStatus("⏳ جاري تفعيل جهازك...", "loading");

        fetch(`${SUPABASE_URL}/rest/v1/rpc/activate_by_token`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'apikey':        ANON_KEY,
                'Authorization': 'Bearer ' + ANON_KEY
            },
            body: JSON.stringify({ p_token: token, p_days: days })
        })
        .then(res => res.text().then(text => ({ ok: res.ok, text })))
        .then(({ ok, text }) => {
            document.getElementById('spinnerWrap').style.display = 'none';
            const result = text.replace(/"/g, '').trim();

            if (ok && result === 'ok') {
                showStatus(
                    days === 2
                        ? "✅ تم التفعيل! أداتك نشطة لمدة 48 ساعة.\nعد للمود الآن 🎮"
                        : "✅ تم التفعيل! أداتك نشطة لمدة 7 أيام.\nعد للمود الآن 🎮",
                    "success");
            } else if (result === 'expired') {
                showStatus("⏰ انتهت صلاحية الرمز! احصل على رابط جديد من الأداة.", "error");
            } else if (result === 'invalid') {
                showStatus("❌ رمز غير صالح أو تم استخدامه مسبقاً!", "error");
            } else {
                showStatus("❌ فشل التفعيل. حاول مجدداً.", "error");
                document.getElementById('authBtn').style.display = 'block';
                document.getElementById('authBtn').disabled = false;
                document.getElementById('optionsGroup').style.display = 'block';
            }
        })
        .catch(() => {
            document.getElementById('spinnerWrap').style.display = 'none';
            showStatus("❌ فشل الاتصال بالسيرفر.", "error");
            document.getElementById('authBtn').style.display = 'block';
            document.getElementById('authBtn').disabled = false;
            document.getElementById('optionsGroup').style.display = 'block';
        });
    }
</script>
</body>
</html>
