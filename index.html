<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تفعيل المود | SPINOX GUL</title>
    <style>
        body { background: #0f0f13; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding-top: 60px; margin: 0; }
        .card { background: #17181f; padding: 40px; display: inline-block; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); border: 1px solid #232430; max-width: 400px; width: 85%; text-align: right; }
        h1 { color: #f39c12; font-size: 24px; margin-bottom: 20px; text-align: center; }
        p { color: #a0a0b0; font-size: 15px; line-height: 1.6; text-align: center; }
        
        /* تصميم الراديو بوتون */
        .options-container { margin: 25px 0; }
        .radio-option { background: #1f2029; padding: 15px; border-radius: 8px; margin-bottom: 12px; display: flex; align-items: center; cursor: pointer; border: 1px solid #2d2f3f; transition: 0.2s; }
        .radio-option:hover { border-color: #f39c12; }
        .radio-option input { margin-left: 15px; width: 18px; height: 18px; accent-color: #f39c12; }
        .radio-label { font-size: 16px; font-weight: bold; }

        /* زر التفعيل والسبينر */
        .btn-activate { background: #2ecc71; color: #fff; border: none; padding: 14px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px; }
        .btn-activate:hover { background: #27ae60; }
        .spinner { border: 4px solid #1f2029; border-top: 4px solid #f39c12; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-text { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div class="card">
        <h1>بوابة التفعيل الذكية 🚀</h1>
        <p>لقد تخطيت الرابط بنجاح! اختر مدة التفعيل التي تريدها واضغط على زر التفعيل المباشر.</p>
        
        <div class="options-container" id="optionsGroup">
            <label class="radio-option">
                <input type="radio" name="duration" value="2" checked>
                <span class="radio-label">تفعيل مجاني لمدة 48 ساعة (يومين)</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="duration" value="7">
                <span class="radio-label">تفعيل مجاني لمدة 7 أيام (أسبوع كامل)</span>
            </label>
        </div>

        <button id="authBtn" class="btn-activate" onclick="processActivation()">تفعيل الأداة الآن</button>
        
        <div id="loader" class="spinner"></div>
        <div id="statusMsg" class="status-text"></div>
    </div>

    <script>
        // جلب الـ HWID من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const hwid = urlParams.get('hwid');

        // إعدادات سوبابيس (ضع مفتاح الـ ANON KEY الحقيقي الخاص بك هنا)
        const SUPABASE_URL = "https://loxrjtxljiqnhvmphzyr.supabase.co";
        const ANON_KEY = "ضع_هنا_مفتاح_الـ_ANON_KEY_الخاص_بمشروعك"; 

        function processActivation() {
            if (!hwid) {
                showStatus("❌ خطأ: رمز الجهاز (HWID) مفقود من الرابط!", "#e74c3c");
                return;
            }

            // معرفة الخيار المحدد من الراديو بوتون
            const selectedDays = document.querySelector('input[name="duration"]:checked').value;

            // إخفاء العناصر وإظهار السبينر
            document.getElementById('authBtn').style.display = 'none';
            document.getElementById('optionsGroup').style.style = 'none'; // إخفاء الخيارات أثناء التفعيل
            document.getElementById('loader').style.display = 'block';
            showStatus("جاري الاتصال بالقاعدة وتفعيل جهازك...", "#f1c40f");

            // إرسال الطلب للسيرفر
            fetch(`${SUPABASE_URL}/rest/v1/rpc/activate_device_custom`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': ANON_KEY,
                    'Authorization': `Bearer ${ANON_KEY}`
                },
                body: JSON.stringify({ p_hwid: hwid, p_days: parseInt(selectedDays) })
            })
            .then(res => {
                document.getElementById('loader').style.display = 'none';
                if(res.ok) {
                    showStatus("✓ تم تفعيل الأداة بنجاح! يمكنك العودة للمود الآن.", "#2ecc71");
                } else {
                    showStatus("❌ فشل التفعيل: هناك مشكلة في استجابة السيرفر.", "#e74c3c");
                    document.getElementById('authBtn').style.display = 'block';
                }
            })
            .catch(err => {
                document.getElementById('loader').style.display = 'none';
                showStatus("❌ خطأ: فشل الاتصال بالسيرفر.", "#e74c3c");
                document.getElementById('authBtn').style.display = 'block';
            });
        }

        function showStatus(text, color) {
            const msg = document.getElementById('statusMsg');
            msg.innerText = text;
            msg.style.color = color;
        }
    </script>
</body>
</html>
